[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deidentify"
version = "0.1.0"
description = "Multi-format PII de-identification with consistent pseudonymization"
requires-python = ">=3.9"
dependencies = [
    "presidio-analyzer>=2.2.350",
    "presidio-anonymizer>=2.2.350",
    "spacy>=3.4",
    "faker>=20.0",
    "lxml>=4.9",
    "PyMuPDF>=1.23",
    "python-docx>=1.0",
]

[project.scripts]
deidentify = "deidentify.cli:main"

[tool.setuptools.packages.find]
include = ["deidentify*"]
